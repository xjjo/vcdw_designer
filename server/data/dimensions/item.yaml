joins:
  - id: join_itm_207
    name: Attribute keys (model_attribute_keys_stg)
    leftTable: item_nc
    leftAlias: i
    rightTable: model_attribute_keys_stg
    rightAlias: attr
    joinType: LEFT
    onConditions:
      - left: attr.dim_or_fact_table
        op: =
        right: upper('${dw.dim.or.fact.table.name}')
      - left: i.sys_item_id
        op: =
        right: attr.oltp_id
  - id: join_itm_208
    name: Product group level assoc (CTE item_pgrp_level_assoc)
    leftTable: item_nc
    leftAlias: i
    rightTable: dw_item_pgrp_level_assoc
    rightAlias: dw2
    joinType: LEFT
    onConditions:
      - left: dw2.sys_item_id
        op: =
        right: i.sys_item_id
      - left: dw2.PGRP_TYPE_NAME
        op: =
        right: "'${product.group.type.name}'"
  - id: join_itm_209
    name: Generic item (dw_item)
    leftTable: item_nc
    leftAlias: i
    rightTable: dw_item
    rightAlias: dw1
    joinType: LEFT
    onConditions:
      - left: dw1.SYS_ITEM_ID
        op: =
        right: i.scc_sys_generic_item_id
  - id: join_itm_210
    name: Partner process type
    leftTable: item_nc
    leftAlias: i
    rightTable: partner_process_type
    rightAlias: pt
    joinType: LEFT
    onConditions:
      - left: pt.oltp_id
        op: =
        right: coalesce(i.SYS_PARTNER_PROCESS_TYPE_ID,-1)
      - left: pt.deleted
        op: =
        right: "false"
