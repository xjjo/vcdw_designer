id: dim_item
kind: dimension
name: item
displayName: Item Dimension
description: "Reverse-engineered from item_sync.kjb: item_nc -> item_sync.ktr
  (CTE + 4 left joins + 14 DB lookups + 'set error' UDJC) -> item_stg;
  sync_item_and_error_for_update.ktr (update item / quarantine to
  item_stg_error); sync_item_for_insert.ktr (insert new); attribute keys + EPT
  computation; default row."
domain: Supply Chain Core
requiresStaging: true
dimensionType: staged
nkUpdates: false
sourceNcTables:
  - item_nc
hasDefaultUnknownRow: true
surrogateKey: ITEM_KEY
naturalKey: ITEM_NAME
businessKeys:
  - ITEM_NAME
  - ENT_NAME
isReferenceTable: false
loadStrategy: insert_new
upsertKeys: []
auditProfileId: audit_default
